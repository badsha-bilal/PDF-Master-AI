// Default generator for any tool not in DB
function generateToolData(toolId) {
    return {
        id:toolId,
        name:toolId.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' '),
        icon:'fa-file-pdf',
        iconColor:'#6C63FF',
        cat:'PDF Tools',
        catColor:'#6C63FF',
        desc:'Free PDF tool by Badsha Bilal 👑. No signup required.',
        keywords:`${toolId}, pdf tools, free pdf, Badsha Bilal`,
        type:'upload-single',
        guide:[
            {title:'Upload File',desc:'Upload your PDF document.'},
            {title:'Process',desc:'Wait for the tool to process.'},
            {title:'Download',desc:'Download your processed PDF.'}
        ],
        faq:[],
        related:[]
    };
}

// ==================== MAIN ====================
function getToolId() {
    const params = new URLSearchParams(window.location.search);
    return params.get('tool') || 'merge-pdf';
}

function getToolData(toolId) {
    return FEATURES_DB[toolId] || generateToolData(toolId);
}

function renderPage() {
    const toolId = getToolId();
    const tool = getToolData(toolId);
    
    // SEO
    document.title = `${tool.name} - Free Online | AI PDF Maker Pro`;
    document.getElementById('pageTitle').textContent = `${tool.name} - Free Online | AI PDF Maker Pro`;
    document.getElementById('metaDescription').setAttribute('content', tool.desc);
    document.getElementById('metaKeywords').setAttribute('content', tool.keywords);
    document.getElementById('canonicalLink').href = `https://badsha-bilal.github.io/PDF-Master-AI/feature.html?tool=${toolId}`;
    document.getElementById('ogUrl').setAttribute('content', `https://badsha-bilal.github.io/PDF-Master-AI/feature.html?tool=${toolId}`);
    document.getElementById('ogTitle').setAttribute('content', `${tool.name} - AI PDF Maker Pro`);
    document.getElementById('ogDescription').setAttribute('content', tool.desc);
    document.getElementById('twitterTitle').setAttribute('content', `${tool.name} - AI PDF Maker Pro`);
    document.getElementById('twitterDescription').setAttribute('content', tool.desc);
    
    // Schema
    document.getElementById('schemaData').textContent = JSON.stringify({
        "@context":"https://schema.org",
        "@type":"SoftwareApplication",
        "name":`${tool.name} - AI PDF Maker Pro`,
        "url":`https://badsha-bilal.github.io/PDF-Master-AI/feature.html?tool=${toolId}`,
        "description":tool.desc,
        "applicationCategory":"UtilityApplication",
        "operatingSystem":"All",
        "author":{"@type":"Person","name":"Badsha Bilal 👑"},
        "offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}
    });
    
    // Breadcrumb
    document.getElementById('breadCat').textContent = tool.cat;
    document.getElementById('breadTool').textContent = tool.name;
    
    // Build HTML
    let html = `
    <div class="tool-header">
        <div class="tool-icon"><i class="fas ${tool.icon}" style="color:${tool.iconColor};"></i></div>
        <span class="badge">🆓 FREE</span>
        <h1>${tool.name}</h1>
        <p>${tool.desc}</p>
        <small style="color:var(--gray);">Category: ${tool.cat} | Tool #${tool.id}</small>
    </div>`;
    
    // Workspace
    html += '<div class="workspace"><h3><i class="fas fa-wrench"></i> Workspace</h3>';
    if (tool.type === 'upload-multiple') {
        html += `
        <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
            <i class="fas fa-cloud-upload-alt"></i>
            <p><strong>Drag & Drop Files Here</strong></p>
            <p style="font-size:12px;color:var(--gray);">or click to browse</p>
        </div>
        <input type="file" id="fileInput" multiple accept=".pdf" style="display:none;">
        <button class="btn btn-primary" onclick="process()"><i class="fas ${tool.icon}"></i> ${tool.name}</button>`;
    } else if (tool.type === 'text-input') {
        html += `
        <textarea id="textInput" placeholder="Type or paste your text here..."></textarea>
        ${toolId === 'text-to-pdf' ? `
        <div class="options-row">
            <div><label>Font Size</label><select id="fontSize"><option value="12">12px</option><option value="14" selected>14px</option><option value="16">16px</option><option value="18">18px</option></select></div>
            <div><label>Color</label><input type="color" id="fontColor" value="#000000"></div>
        </div>` : ''}
        <button class="btn btn-primary" onclick="process()"><i class="fas ${tool.icon}"></i> Generate</button>`;
    } else {
        html += `
        <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
            <i class="fas fa-cloud-upload-alt"></i>
            <p><strong>Drag & Drop File Here</strong></p>
            <p style="font-size:12px;color:var(--gray);">or click to browse</p>
        </div>
        <input type="file" id="fileInput" accept=".pdf,.docx,.doc,.jpg,.png,.webp" style="display:none;">
        <button class="btn btn-primary" onclick="process()"><i class="fas ${tool.icon}"></i> ${tool.name}</button>`;
    }
    html += '<div class="result-box" id="resultBox"><i class="fas fa-check-circle"></i> Complete! <a id="dlLink" style="color:#FFD700;cursor:pointer;">Download</a></div>';
    html += '</div>';
    
    // Guide
    if (tool.guide.length > 0) {
        html += '<div class="guide-section"><h2>📋 How to ' + tool.name + '</h2><div class="steps">';
        tool.guide.forEach((s,i) => {
            html += `<div class="step"><div class="step-number">${i+1}</div><div class="step-content"><h4>${s.title}</h4><p>${s.desc}</p></div></div>`;
        });
        html += '</div></div>';
    }
    
    // FAQ
    if (tool.faq.length > 0) {
        html += '<div class="faq-section"><h2>❓ FAQ</h2>';
        tool.faq.forEach(f => {
            html += `<div class="faq-item" onclick="this.classList.toggle('active')"><h4><i class="fas fa-question-circle"></i> ${f.q}</h4><p>${f.a}</p></div>`;
        });
        html += '</div>';
    }
    
    // Related
    if (tool.related.length > 0) {
        html += '<div class="related-section"><h2>🔗 Related Tools</h2><div class="related-grid">';
        tool.related.forEach(r => {
            const rt = getToolData(r);
            html += `<a href="feature.html?tool=${r}" class="related-card"><i class="fas ${rt.icon}" style="color:${rt.iconColor};"></i><div><h4>${rt.name}</h4><small style="color:var(--gray);">${rt.cat}</small></div></a>`;
        });
        html += '</div></div>';
    }
    
    document.getElementById('app').innerHTML = html;
    
    // Drag & Drop
    setTimeout(() => {
        const dz = document.querySelector('.upload-zone');
        if (dz) {
            dz.addEventListener('dragover', e => { e.preventDefault(); dz.style.borderColor='#FF6584'; });
            dz.addEventListener('dragleave', () => { dz.style.borderColor='var(--primary)'; });
            dz.addEventListener('drop', e => { e.preventDefault(); dz.style.borderColor='var(--primary)'; });
        }
    }, 300);
}

function process() {
    const btn = document.querySelector('.btn-primary');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Processing...';
    
    setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = `<i class="fas fa-check"></i> Complete!`;
        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('dlLink').onclick = () => showToast('Demo mode - Full processing coming soon! 🚀');
        showToast('✅ Processing complete! (Demo mode)');
        gtag('event', 'tool_used', { 'event_category': 'tool', 'event_label': getToolId() });
    }, 1500);
}

function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}

window.process = process;
window.showToast = showToast;

renderPage();
gtag('event', 'page_view', { 'event_category': 'tool_page', 'event_label': getToolId() });
</script>
</body>
</html>
